name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A71650: ${{ secrets.A71650 }}
          BD8B3E: ${{ secrets.BD8B3E }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A71650', '')
          tag_b = os.environ.get('BD8B3E', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- ff5e43e3de2e84d06b50f3bdb68c27ae -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 02e3be4cd372f2b2bb -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
